name = "toumyou-payload-cms"
main = ".open-next/worker.js"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "D1"
database_name = "toumyou_payload_cms"
database_id = "REPLACE_WITH_PAYLOAD_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "image"

[vars]
PAYLOAD_PUBLIC_SERVER_URL = "https://cms.toumyou.com"
